services:
  backend:
    build:
      context: ./backend
    container_name: lumens-backend
    restart: unless-stopped
    expose:
      - "4000"
    env_file:
      - ./backend/.env
    environment:
      - PORT=4000

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lumens-app
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3000
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:1.27-alpine
    container_name: lumens-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - app
