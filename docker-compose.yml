services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lumens-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - PORT=4000
    expose:
      - "4000"
    logging:
      driver: awslogs
      options:
        awslogs-region: us-east-2
        awslogs-group: /lumen/backend
        awslogs-create-group: "true"
        tag: "{{.Name}}"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lumens-frontend
    restart: unless-stopped
    expose:
      - "3000"
    logging:
      driver: awslogs
      options:
        awslogs-region: us-east-2
        awslogs-group: /lumen/frontend
        awslogs-create-group: "true"
        tag: "{{.Name}}"

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: lumens-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
      app:
        condition: service_healthy
    logging:
      driver: awslogs
      options:
        awslogs-region: us-east-2
        awslogs-group: /lumen/nginx
        awslogs-create-group: "true"
        tag: "{{.Name}}"
